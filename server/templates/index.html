<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Satellite Server - White Noise Player" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Satellite" />
    <link rel="manifest" href="/static/manifest.json" />
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/static/satellite.svg" />
    <link rel="apple-touch-icon" href="/static/icon-192x192.png" />
    <title>Satellite Server</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Victor+Mono:wght@400;600;700&display=swap");
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Victor Mono", monospace;
        background: #000;
        color: #fff;
        min-height: 100vh;
        padding: 32px 20px;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
          linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
        background-size: 48px 48px;
        mask-image: radial-gradient(circle at center, #000 0, transparent 72%);
      }
      main { width: min(920px, 100%); margin: 0 auto; position: relative; }
      header {
        display: flex;
        justify-content: space-between;
        align-items: end;
        gap: 24px;
        border-bottom: 1px solid #fff;
        padding: 12px 0 22px;
        margin-bottom: 24px;
      }
      h1 {
        color: #d8d8d8;
        font-size: clamp(24px, 5vw, 48px);
        font-weight: 300;
        letter-spacing: 4px;
        line-height: 1.05;
        margin-top: 8px;
        text-transform: uppercase;
      }
      .eyebrow, .panel h2 {
        font-size: 11px;
        letter-spacing: 2px;
        color: #888;
        text-transform: uppercase;
      }
      .controls {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      button {
        background: #fff;
        color: #000;
        border: 1px solid #fff;
        padding: 13px 18px;
        font-size: 12px;
        font-weight: 600;
        font-family: "Victor Mono", monospace;
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 2px;
        transition: opacity 0.2s;
      }
      button:hover {
        opacity: 0.8;
      }
      button.paused {
        background: #222;
        color: #fff;
        border: 1px solid #fff;
      }
      button.download {
        background: transparent;
        color: #fff;
        border: 1px solid #fff;
      }
      button.ghost { background: #000; color: #fff; }
      .panel {
        border: 1px solid #444;
        background: rgba(255,255,255,.025);
        margin-top: 16px;
      }
      .panel h2 {
        display: flex;
        justify-content: space-between;
        border-bottom: 1px solid #333;
        padding: 12px 14px;
      }
      .satellite-row {
        display: grid;
        grid-template-columns: 1fr 120px 90px 150px 96px 42px;
        align-items: center;
        gap: 14px;
        padding: 14px;
        border-top: 1px solid #333;
        font-size: 14px;
      }
      .satellite-row:first-child {
        border-top: none;
      }
      .dim { color: #777; padding: 18px 14px; font-size: 13px; }
      .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .state { font-weight: 700; letter-spacing: 1px; }
      .online, .offline { color: #fff; }
      .online::before, .offline::before { content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 8px; background: #fff; vertical-align: 1px; }
      .offline { color: #777; }
      .offline::before { background: #555; }
      button.clear {
        background: transparent;
        color: #999;
        border: 1px solid #555;
      }
      button.delete {
        background: #000;
        color: #777;
        border: 1px solid #444;
        padding: 13px 0;
      }
      button.delete:hover { color: #fff; border-color: #fff; }
      input[type="range"] { width: 100%; accent-color: #fff; }
      .panel-footer { padding: 14px; border-top: 1px solid #333; display: flex; justify-content: flex-end; }
      @media (max-width: 700px) {
        header { display: block; }
        .controls { margin-top: 18px; }
        .satellite-row { grid-template-columns: 1fr; gap: 8px; }
        .satellite-row button { width: 100%; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <div class="eyebrow">white noise control plane</div>
          <h1>Satellite Server</h1>
        </div>
        <div class="controls">
          <button class="download" onclick="downloadApp()">Download APK</button>
        </div>
      </header>

      <div class="panel">
        <h2><span>SATELLITES</span><span id="count">0 ONLINE</span></h2>
        <div id="satellites"></div>
        <div class="panel-footer"><button class="clear" onclick="clearSatellites()">Clear Satellites</button></div>
      </div>
    </main>

    <script>
      let ws;

      function setSatelliteStatus(id, state) {
        return fetch(`/satellites/${encodeURIComponent(id)}/status`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ state: state }),
        }).then((r) => r.json());
      }

      function setSatelliteVolume(id, volume) {
        return fetch(`/satellites/${encodeURIComponent(id)}/volume`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ volume: Number(volume) }),
        }).then((r) => r.json());
      }

      function renderSatellites(items) {
        const root = document.getElementById("satellites");
        if (!Array.isArray(items) || items.length === 0) {
          root.innerHTML =
            '<div class="dim">No satellites registered yet.</div>';
          return;
        }

        root.innerHTML = items
          .map((s) => {
            const statusClass = s.connected ? "online" : "offline";
            const statusText = s.connected ? "connected" : "disconnected";
            const state = s.state || "Paused";
            const volume = Number(s.volume ?? 1);
            const next = state === "Playing" ? "Paused" : "Playing";
            const label = state === "Playing" ? "Pause" : "Play";
            return `<div class="satellite-row"><span class="name">${escapeHtml(s.name)}</span><span class="${statusClass}">${statusText}</span><span class="state">${state}</span><label>${Math.round(volume * 100)}% <input type="range" min="0" max="1" step="0.05" value="${volume}" onchange='setSatelliteVolume(${JSON.stringify(s.id)}, this.value)' /></label><button class="ghost" onclick='setSatelliteStatus(${JSON.stringify(s.id)}, ${JSON.stringify(next)})'>${label}</button><button class="delete" title="Delete satellite" onclick='deleteSatellite(${JSON.stringify(s.id)}, ${JSON.stringify(s.name)})'>×</button></div>`;
          })
          .join("");
      }

      function escapeHtml(value) {
        return String(value ?? "").replace(/[&<>'"]/g, (ch) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          "'": "&#39;",
          '"': "&quot;",
        }[ch]));
      }

      function render(payload) {
        const satellites = payload.satellites || [];
        document.getElementById("count").textContent = `${satellites.filter((s) => s.connected).length}/${satellites.length} ONLINE`;
        renderSatellites(satellites);
      }

      function connectWebSocket() {
        const protocol = window.location.protocol === "https:" ? "wss" : "ws";
        ws = new WebSocket(`${protocol}://${window.location.host}/ws/status`);

        ws.onmessage = (event) => {
          const data = JSON.parse(event.data);
          render(data);
        };

        ws.onclose = () => {
          setTimeout(connectWebSocket, 1500);
        };
      }

      function downloadApp() {
        window.location.href = "/download/apk";
      }

      async function clearSatellites() {
        if (!confirm("Are you sure you want to clear all satellites?")) return;
        try {
          const response = await fetch("/satellites", { method: "DELETE" });
          const data = await response.json();
          console.log("Cleared satellites:", data);
        } catch (e) {
          console.error("Failed to clear satellites:", e);
        }
      }

      async function deleteSatellite(id, name) {
        if (!confirm(`Delete satellite "${name}"?`)) return;
        try {
          const response = await fetch(`/satellites/${encodeURIComponent(id)}`, { method: "DELETE" });
          render(await response.json());
        } catch (e) {
          console.error("Failed to delete satellite:", e);
        }
      }

      setInterval(() => {
        if (ws && ws.readyState === WebSocket.OPEN) {
          return;
        }
        fetch("/status").then((r) => r.json()).then(render);
      }, 3000);

      connectWebSocket();
      render({ satellites: [] });

      // Register service worker for PWA support
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/static/sw.js")
          .then(() => console.log("Service Worker registered"))
          .catch((err) => console.error("Service Worker registration failed:", err));
      }
    </script>
  </body>
</html>
